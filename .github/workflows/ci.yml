name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz
        run: |
          go test -run XXX -fuzz FuzzTree -fuzztime 30s ./internal/btree
          go test -run XXX -fuzz FuzzMatchRaw -fuzztime 30s .
      - name: Shared library and Python example
        run: |
          go build -buildmode=c-shared -o examples/python/libdoclite.so ./sharedlib
          cd examples/python && python3 example.py
      - name: Go example
        run: go run ./examples/golang
      - name: Benchmarks build and run once
        working-directory: bench
        run: go test -run XXX -bench . -benchtime 1x
